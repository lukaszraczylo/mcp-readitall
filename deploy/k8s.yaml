apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-readitall
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: mcp-readitall
    app.kubernetes.io/part-of: mcp-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-readitall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-readitall
        app.kubernetes.io/part-of: mcp-servers
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: multi-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/lukaszraczylo/mcp-readitall:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: READITALL_ADDR
              value: ":8080"
            - name: READITALL_SESSIONS_DIR
              value: /data
            # Chrome needs a writable HOME/tmp with read-only rootfs
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-readitall
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/name: mcp-readitall
    app.kubernetes.io/part-of: mcp-servers
spec:
  selector:
    app.kubernetes.io/name: mcp-readitall
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-readitall
  namespace: agentgateway-system
spec:
  mcp:
    sessionRouting: Stateless
    targets:
      - name: readitall
        static:
          host: mcp-readitall.agentgateway-system.svc.cluster.local
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
